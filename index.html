<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ff4d6d;
            background-image: url("https://www.transparenttextures.com/patterns/hearts.png");
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .slideshow-container {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            position: relative;
        }
        .profile-img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            position: absolute; top: 0; left: 0;
            opacity: 0; transition: opacity 1s;
        }
        .profile-img.active { opacity: 1; }
        
        h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        #yesBtn { background-color: #4CAF50; color: white; }
        #noBtn { background-color: white; color: #ff4d6d; }

        /* Hidden Surprise Elements */
        #surprise { display: none; flex-direction: column; align-items: center; }
        .teddy { width: 200px; animation: bounce 2s infinite; }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card.zoom { transform: scale(1.2); }
        .card p { font-size: 1.3rem; color: #ff4d6d; font-weight: bold; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .heart-float { position: absolute; color: white; animation: float 3s linear infinite; }
        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <div class="slideshow-container">
            <img src="WA_1770013506461.jpeg" class="profile-img active">
            <img src="WA_1770013509078.jpeg" class="profile-img">
            <img src="WA_1770013517239.jpeg" class="profile-img">
            <img src="WA_1770013519589.jpeg" class="profile-img">
        </div>
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="showTeddy()">YES! 🥰</button>
            <button id="noBtn" onclick="growYes()">No 🥺</button>
        </div>
    </div>

    <div id="surprise">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHY5bXF6amtxNmZ1eG5yZzRreHpjZ3R6Zzh6Z3R6Zzh6Z3R6Zzh6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/vVzH2FxModQ09S8pId/giphy.gif" class="teddy">
        <div class="card" id="loveCard">
            <p>I knew you'd say Yes! ❤️</p>
            <p>You are the most beautiful person I've ever met. I'm so lucky to have you in my life. Let's make this Valentine's Day special together! ✨</p>
        </div>
    </div>

    <script>
        // Slideshow
        let currentImg = 0;
        const imgs = document.querySelectorAll('.profile-img');
        setInterval(() => {
            imgs[currentImg].classList.remove('active');
            currentImg = (currentImg + 1) % imgs.length;
            imgs[currentImg].classList.add('active');
        }, 2000);

        let yesSize = 1.2;
        function growYes() {
            yesSize += 0.5;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.fontSize = yesSize + 'rem';
            yesBtn.style.padding = (15 * yesSize/1.2) + 'px ' + (25 * yesSize/1.2) + 'px';
            
            // Change "No" text to make it funnier
            const noMessages = ["Are you sure?", "Really?", "Think again!", "Pwease?", "You're clicking the wrong one!"];
            document.getElementById('noBtn').innerText = noMessages[Math.floor(Math.random() * noMessages.length)];
        }

        function showTeddy() {
            document.getElementById('main-content').style.display = 'none';
            const surprise = document.getElementById('surprise');
            surprise.style.display = 'flex';
            
            setTimeout(() => {
                const card = document.getElementById('loveCard');
                card.classList.add('zoom');
                setInterval(createHeart, 300);
            }, 500);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }
    </script>
</body>
</html>
