<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            max-width: 400px;
            z-index: 10;
        }
        h1 { color: #ff4d6d; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #590d22; font-size: 1.1rem; line-height: 1.5; }
        .buttons { margin-top: 30px; height: 50px; position: relative; }
        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); }
        #noBtn { background-color: #ffb3c1; color: white; position: absolute; }
        img { width: 150px; margin-bottom: 10px; }
        .heart { position: absolute; color: #ff4d6d; animation: float 3s linear infinite; }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="quiz-card">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycGZ4YmZ4ZzB4eGZ4ZzB4eGZ4ZzB4eGZ4ZzB4eGZ4ZzB4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/vO8F4fYK3YIn6/giphy.gif" alt="Cute Bear">
        <h1>Renewal Notice! 🌹</h1>
        <p>Your 1-year contract as <b>My Valentine</b> is up for renewal. Do you accept the terms and conditions (including infinite hugs)?</p>
        <div class="buttons">
            <button id="yesBtn" onclick="success()">I AGREE! ❤️</button>
            <button id="noBtn" onmouseover="moveButton()">Absolutely Not</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function success() {
            document.getElementById('quiz-card').innerHTML = `
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZkbW13eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/Lp71UqhcHh40S8a0zg/giphy.gif">
                <h1>Official Valentine! ❤️</h1>
                <p>Contract signed! I love you so much, beautiful. I'm the luckiest guy to have you by my side. Get ready for a surprise soon! ✨</p>
            `;
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }
    </script>
</body>
</html>
