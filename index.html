<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ff4d6d;
            background-image: url("https://www.transparenttextures.com/patterns/hearts.png");
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 320px;
            z-index: 10;
            border: 4px solid #ffb3c1;
        }
        .slideshow-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px;
            position: relative;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid #ff4d6d;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .profile-img.active { opacity: 1; }
        h1 { color: #ff4d6d; font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #590d22; font-size: 1rem; line-height: 1.4; }
        
        /* Updated Button Layout */
        .buttons { 
            margin-top: 20px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            min-height: 120px;
        }
        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            width: 200px;
        }
        #yesBtn { background-color: #ff4d6d; color: white; z-index: 5; }
        #noBtn { background-color: #ffb3c1; color: white; transition: 0.1s; position: relative; }
        
        .heart-float { position: absolute; color: #ffffff; animation: float 3s linear infinite; font-size: 20px; pointer-events: none;}
        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="quiz-card">
        <div class="slideshow-container">
            <img src="WA_1770013506461.jpeg" class="profile-img active">
            <img src="WA_1770013509078.jpeg" class="profile-img">
            <img src="WA_1770013517239.jpeg" class="profile-img">
            <img src="WA_1770013519589.jpeg" class="profile-img">
        </div>
        <h1>Renewal Notice! 🌹</h1>
        <p>Your status as <b>Best Girlfriend</b> is up for renewal. Do you agree to another year of us? ❤️</p>
        <div class="buttons">
            <button id="yesBtn" onclick="success()">I AGREE! ❤️</button>
            <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">No</button>
        </div>
    </div>

    <script>
        // Slideshow
        let currentImg = 0;
        const imgs = document.querySelectorAll('.profile-img');
        setInterval(() => {
            imgs[currentImg].classList.remove('active');
            currentImg = (currentImg + 1) % imgs.length;
            imgs[currentImg].classList.add('active');
        }, 2500);

        // Fixed Runaway Logic for Mobile
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // This ensures it stays within the phone screen
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function success() {
            document.getElementById('quiz-card').innerHTML = `
                <h1 style="font-size: 3rem;">🥰</h1>
                <h1>Contract Signed! ❤️</h1>
                <p>I love you so much! You're stuck with me for another year! ✨</p>
            `;
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }
    </script>
</body>
</html>
